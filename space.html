<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Invaders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #000000 0%, #1a1a1a 100%);
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: start;
      align-items: center;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    header, main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .game-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .canvas-wrapper {
      width: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 20px auto;
      background: #000;
      border: 2px solid #fff;
    }
    .game-button {
      display: inline-block;
      text-align: center;
      background-color: #4a5568;
      color: #f7fafc;
      padding: 10px 20px;
      margin: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .game-button:hover {
      background-color: #2d3748;
      transform: scale(1.05);
    }
    .game-button:active {
      transform: scale(0.95);
    }

    .starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle 2s infinite ease-in-out alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.1; }
      to { opacity: 1; }
    }

    .controls-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 300px;
      margin: 10px 0;
    }
    .control-button {
      background-color: #4a5568;
      color: #fff;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }
    .control-button:hover {
      background-color: #2d3748;
      transform: scale(1.05);
    }
    .control-button:active {
      transform: scale(0.95);
    }

    #nextLevelButton {
      display: none;
    }

    /* Reset Button is below the control buttons, as requested */
    #resetGameButton {
      display: none;
    }

    .game-start-overlay {
      position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.7rem; text-align: center;
      background: rgba(2, 4, 12, 0.82); cursor: pointer; padding: 1rem; border-radius: 8px;
    }
    .game-start-overlay.hidden { display: none; }
    .go-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(1.6rem, 6vw, 2.6rem); letter-spacing: 0.1em; color: #fff; text-shadow: 0 0 20px #00f0ff, 0 0 60px #ff2fd6; }
    .go-title.lost { text-shadow: 0 0 20px #ff3355, 0 0 60px #ff3355; }
    .go-sub { color: #8b93b8; letter-spacing: 0.2em; font-size: 0.8rem; font-family: 'Orbitron', sans-serif; }
    .go-score { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #ffb300; letter-spacing: 0.1em; }
    .go-best { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #a6ff00; letter-spacing: 0.12em; }
    .go-btn {
      font-family: 'Orbitron', sans-serif; font-size: 0.85rem; letter-spacing: 0.16em;
      background: linear-gradient(100deg, rgba(0,240,255,0.18), rgba(255,47,214,0.18));
      border: 1px solid #00f0ff; color: #fff; border-radius: 999px;
      padding: 0.75rem 2rem; cursor: pointer; margin-top: 0.5rem;
    }
    .go-btn:hover { box-shadow: 0 0 22px rgba(0,240,255,0.6); }

    @media (max-width: 400px) {
      .control-button {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <header class="p-4 w-full flex justify-center">
    <a href="index.html" class="game-button">Back to Home</a>
  </header>

  <main class="game-container">
    <h1 class="text-3xl font-bold mb-4 mt-4 text-center">Space Invaders</h1>
    <div class="canvas-wrapper">
      <canvas id="spaceGameCanvas"></canvas>
    </div>
    <button id="startSpaceGame" class="game-button">Start Game</button>
    <button id="nextLevelButton" class="game-button">Next Level</button>

    <!-- On-screen controls: Left, Shoot (middle), Right -->
    <div class="controls-container">
      <div class="control-button" id="leftButton">←</div>
      <div class="control-button" id="shootButton">★</div>
      <div class="control-button" id="rightButton">→</div>
    </div>

    <!-- Reset button below the controls -->
    <button id="resetGameButton" class="game-button">Reset Game</button>
  </main>

  <div class="starfield" id="starfield"></div>

  <script src="js/arcade.js"></script>
  <script src="js/spaceinvaders.js"></script>
  <script>
    const starfield = document.getElementById('starfield');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      const size = Math.random() * 3;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      starfield.appendChild(star);
    }
  </script>
</body>
</html>
