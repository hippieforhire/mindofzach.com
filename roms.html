<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROM Library — mindofzach.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(10, 14, 30, 0.88);
    --neon-cyan: #00f0ff;
    --neon-magenta: #ff2fd6;
    --neon-lime: #a6ff00;
    --neon-amber: #ffb300;
    --neon-violet: #8b5cf6;
    --text: #e8ecff;
    --muted: #8b93b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Rajdhani', sans-serif; color: var(--text);
    background: var(--bg) radial-gradient(ellipse 80% 55% at 50% -10%, rgba(0,240,255,0.07), transparent),
                var(--bg) radial-gradient(ellipse 70% 50% at 85% 110%, rgba(255,47,214,0.06), transparent);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: 1rem 1.2rem; border-bottom: 1px solid rgba(0,240,255,0.18);
    background: rgba(5,6,15,0.7); position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(8px);
  }
  .back {
    font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 0.1em;
    color: var(--neon-cyan); text-decoration: none;
    border: 1px solid rgba(0,240,255,0.4); border-radius: 8px; padding: 0.45rem 0.8rem;
    text-shadow: 0 0 8px rgba(0,240,255,0.6);
  }
  h1 {
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.25rem; margin: 0;
    letter-spacing: 0.12em; text-shadow: 0 0 18px rgba(0,240,255,0.55);
  }
  main { max-width: 900px; margin: 0 auto; padding: 1.4rem 1.2rem 3rem; }
  .sub { color: var(--muted); margin: 0 0 1.4rem; font-size: 1.02rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .rom-card {
    --card-accent: var(--neon-cyan);
    background: var(--panel); border: 1px solid rgba(0,240,255,0.16);
    border-radius: 14px; padding: 1.1rem; cursor: pointer; position: relative;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .rom-card:hover, .rom-card:active {
    transform: translateY(-3px); border-color: var(--card-accent);
    box-shadow: 0 0 24px -4px var(--card-accent);
  }
  .cart {
    width: 100%; aspect-ratio: 4/3; border-radius: 10px; margin-bottom: 0.9rem;
    background: linear-gradient(145deg, #12162e, #070a18);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .cart svg { width: 44%; height: 64%; fill: var(--card-accent); filter: drop-shadow(0 0 10px var(--card-accent)); opacity: 0.9; }
  .sys {
    position: absolute; top: 8px; right: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em;
    background: rgba(0,0,0,0.55); color: var(--card-accent);
    border: 1px solid var(--card-accent); border-radius: 6px; padding: 0.2rem 0.45rem;
  }
  .rom-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1rem; margin: 0 0 0.3rem; letter-spacing: 0.04em; }
  .rom-card p { color: var(--muted); font-size: 0.92rem; margin: 0 0 0.8rem; }
  .play {
    font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 0.14em;
    color: var(--card-accent); text-shadow: 0 0 10px var(--card-accent);
  }
  .foot { margin-top: 2.2rem; color: var(--muted); font-size: 0.9rem; text-align: center; line-height: 1.6; }
  .empty {
    text-align: center; color: var(--muted); padding: 3rem 1rem;
    border: 1px dashed rgba(0,240,255,0.25); border-radius: 14px; font-size: 1.05rem;
  }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← ARCADE</a>
  <h1>ROM LIBRARY</h1>
</header>
<main>
  <p class="sub">Your own ripped cartridges, playable right in the browser. Touch controls and save states included.</p>
  <div class="grid" id="romGrid"></div>
  <p class="foot">Progress saves in this browser. More cartridges get added to the shelf as they arrive.</p>
</main>
<script>
  const ROMS = [
    { id: 'paperboy', title: 'Paperboy', system: 'NES', core: 'nes', file: 'Paperboy (USA).nes', accent: '#00f0ff',
      blurb: 'Deliver papers, dodge everything. The classic paper route.' },
  ];
  const CART_SVG = '<svg viewBox="0 0 24 24"><path d="M7 2h10v20l-2-1.4-2 1.4-2-1.4L9 22l-2-1.4z"/><rect x="9.5" y="5" width="5" height="3.5"/></svg>';
  const grid = document.getElementById('romGrid');
  if (!ROMS.length) {
    grid.innerHTML = '<div class="empty">The shelf is empty — cartridges arriving soon.</div>';
  }
  ROMS.forEach(r => {
    const card = document.createElement('div');
    card.className = 'rom-card';
    card.style.setProperty('--card-accent', r.accent);
    card.innerHTML =
      '<div class="cart">' + CART_SVG + '<span class="sys">' + r.system + '</span></div>' +
      '<h3>' + r.title + '</h3><p>' + r.blurb + '</p>' +
      '<span class="play">PLAY ▸</span>';
    card.addEventListener('click', () => { window.location.href = 'play.html?game=' + encodeURIComponent(r.id); });
    grid.appendChild(card);
  });
</script>
</body>
</html>
