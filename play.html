<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Now Playing — mindofzach.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060f; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #back {
    position: fixed; top: 10px; left: 10px; z-index: 9999;
    font-family: 'Orbitron', sans-serif; font-size: 0.72rem; letter-spacing: 0.1em;
    color: #00f0ff; text-decoration: none; background: rgba(5,6,15,0.72);
    border: 1px solid rgba(0,240,255,0.45); border-radius: 8px; padding: 0.5rem 0.75rem;
    text-shadow: 0 0 8px rgba(0,240,255,0.6);
  }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8b93b8; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; text-align: center; padding: 2rem;
  }
  #msg a { color: #00f0ff; }
</style>
</head>
<body>
<div id="game"></div>
<a id="back" href="roms.html">✕ LIBRARY</a>
<div id="msg" style="display:none"></div>
<script>
  // One entry per cartridge. `file` lives in the roms/ folder next to this page.
  const GAMES = {
    paperboy: { name: 'Paperboy (USA)', core: 'nes', file: 'Paperboy (USA).nes' },
  };
  const id = new URLSearchParams(location.search).get('game');
  const g = GAMES[id];
  if (!g) {
    const m = document.getElementById('msg');
    m.style.display = 'flex';
    m.innerHTML = '<p>Unknown game.<br><a href="roms.html">Back to the library</a></p>';
  } else {
    document.title = g.name + ' — mindofzach.com';
    EJS_player = '#game';
    EJS_gameName = g.name;
    EJS_core = g.core;
    EJS_gameUrl = 'roms/' + g.file;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_backgroundColor = '#05060f';
    EJS_startOnLoaded = true;
    const s = document.createElement('script');
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.head.appendChild(s);
  }
</script>
</body>
</html>
